name: Skill proposal
description: 提議新增或改善可重用的技能
title: "[Skill] "
labels: []
body:
  - type: input
    id: name
    attributes:
      label: 技能名稱
      description: 現有技能名稱，或建議的小寫連字號名稱
      placeholder: tool-result-interpretation
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 適用與不適用情境
      description: 各給一個具體例子，說明技能邊界。
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 建議程序與驗證
      description: 說明可重用的步驟，以及如何知道它正確運作。不要貼單題答案或隱藏測試。
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 來源及權利
      description: 如依賴外部文件或 API，附上連結、版本及可公開分享的依據。
    validations:
      required: false
